# Render Blueprint — deploys the Waypoints backend as a free web service.
# See https://render.com/docs/blueprint-spec

services:
  - type: web
    name: waypoints-api
    runtime: docker
    repo: https://github.com/zakariaxk/waypoints-app.git
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "8080"
      - key: HOST
        value: "0.0.0.0"
      - key: NODE_ENV
        value: "production"
    healthCheckPath: /health
