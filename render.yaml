# Render Blueprint — deploys the Waypoints backend as a free web service.
# See https://render.com/docs/blueprint-spec

services:
  - type: web
    name: waypoints-api
    runtime: node
    repo: https://github.com/zakariaxk/waypoints-app.git
    branch: main
    plan: free
    buildCommand: npm ci && npm run build -w packages/shared && npm run build -w services/api
    startCommand: node services/api/dist/index.js
    envVars:
      - key: PORT
        value: "8080"
      - key: HOST
        value: "0.0.0.0"
      - key: NODE_ENV
        value: "production"
    healthCheckPath: /health
