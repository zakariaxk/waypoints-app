# Fly.io deployment configuration
# Deploy: fly launch / fly deploy

app = "waypoints-api"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  CORS_ORIGIN = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
