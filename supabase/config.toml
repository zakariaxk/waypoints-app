# Supabase CLI configuration for local development.
# `supabase start` brings the stack up; `supabase db reset` applies
# migrations/ in order and then seed.sql.

project_id = "waypoints"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# Feed clips are capped at 12 MB (plan 10.5, F3); photos are far smaller.
file_size_limit = "15MiB"

[auth]
enabled = true
site_url = "waypoints://auth-callback"
additional_redirect_urls = ["waypoints://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
otp_length = 6
otp_expiry = 3600
max_frequency = "30s"

[auth.sms]
enable_signup = false

[auth.external.apple]
enabled = false
client_id = ""
secret = ""

[analytics]
enabled = false
