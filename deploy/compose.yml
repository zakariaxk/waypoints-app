# Two gateway nodes behind Caddy, joined by NATS (plan 7.6).
# docker compose -f deploy/compose.yml up --build
services:
  nats:
    image: nats:2.10-alpine
    command: ["-js=false"]
  gateway-a:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: ../server/.env
    environment: { NATS_URL: "nats://nats:4222", WAYPOINTS_NODE: "a", WAYPOINTS_ADDR: ":8080" }
    depends_on: [nats]
  gateway-b:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: ../server/.env
    environment: { NATS_URL: "nats://nats:4222", WAYPOINTS_NODE: "b", WAYPOINTS_ADDR: ":8080" }
    depends_on: [nats]
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on: [gateway-a, gateway-b]
