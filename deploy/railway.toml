# Railway service scaffold for the gateway (L47). No real secrets live here —
# environment variables are set on the service in the Railway dashboard or with
# `railway variables`, per deploy/README.md.
[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/Dockerfile"

[deploy]
# Railway injects PORT; the gateway binds it automatically (config.go).
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
